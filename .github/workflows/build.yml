name: Build

on:
  push:
  workflow_dispatch:

# Read-only by default; only the jobs that publish get write access.
permissions:
  contents: read

env:
  # SHA-256 of the permanent signing certificate (public, not a secret). Releases must match it,
  # so an update always installs over the previous version.
  RELEASE_CERT_SHA256: ace62a53f6b46b9c71fffa08776f6381bc78bdc6f655a5986d7260182de55fd9

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK parts
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.p12; echo "KEYSTORE=release.p12" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF" = refs/heads/main ] || [ "$GITHUB_REF" = refs/heads/claude/clearframe-launcher ]; then
            echo "::error::The KEYSTORE_B64 secret is missing. Release builds must use the permanent key."; exit 1
          else
            echo "::warning::No KEYSTORE_B64 secret: signing with a throwaway key."
          fi
      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: sh build.sh
      - name: Show signing certificate
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs out/clearframe.apk | tee out/cert.txt
          rm -f release.p12
      - uses: actions/upload-artifact@v4
        with:
          name: clearframe-apk
          path: |
            out/clearframe.apk
            out/cert.txt

  release:
    # Publishes the APK that passed the emulator check at a fixed link the TV can download:
    # https://github.com/<owner>/ClearFrameTV/releases/download/latest/clearframe.apk
    # Only from main, so only merged code reaches the TV; branch builds stay in the run's artifacts.
    needs: [apk, emulator]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: clearframe-apk
          path: out
      - name: Check the APK is signed with the permanent key
        run: |
          got=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' out/cert.txt)
          echo "certificate SHA-256: $got"
          [ "$got" = "$RELEASE_CERT_SHA256" ] || { echo "::error::APK is not signed with the permanent key; not publishing."; exit 1; }
      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest -R "$GITHUB_REPOSITORY" --title "Latest build" --notes "Built from ${GITHUB_SHA}" --prerelease --target "$GITHUB_SHA"
          gh release upload latest out/clearframe.apk -R "$GITHUB_REPOSITORY" --clobber
          gh release edit latest -R "$GITHUB_REPOSITORY" --notes "Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}"

  emulator:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: clearframe-apk
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android TV 8.0 emulator
        # Third-party action: pinned to a commit (v2.38.0); Dependabot proposes updates.
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 26
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh ci/emulator-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: screenshots

  screenshots:
    # A separate job, so the third-party emulator action above never holds a write token.
    needs: emulator
    if: always() && needs.emulator.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: emulator-screenshots
          path: screenshots
      - name: Publish screenshots to the ci-screenshots branch
        run: |
          [ -d screenshots ] || exit 0
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git fetch origin ci-screenshots || true
          git checkout --orphan ci-screenshots-new
          git rm -rq --cached . ; git clean -fdq -e screenshots
          git add screenshots
          git commit -qm "Emulator screenshots for ${GITHUB_SHA}"
          git push -f origin HEAD:ci-screenshots
