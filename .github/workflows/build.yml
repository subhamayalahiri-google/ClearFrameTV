name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK parts
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then echo "$KEYSTORE_B64" | base64 -d > release.jks; echo "KEYSTORE=release.jks" >> "$GITHUB_ENV"; else echo "::warning::No KEYSTORE_B64 secret: signing with a throwaway key. Updates will need an uninstall first."; fi
      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: sh build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: clearframe-apk
          path: out/clearframe.apk

  release:
    # Publishes the APK that passed the emulator check at a fixed link the TV can download:
    # https://github.com/<owner>/ClearFrameTV/releases/download/latest/clearframe.apk
    needs: [apk, emulator]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/clearframe-launcher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: clearframe-apk
          path: out
      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create latest -R "$GITHUB_REPOSITORY" --title "Latest build" --notes "Built from ${GITHUB_SHA}" --prerelease --target "$GITHUB_SHA"
          gh release upload latest out/clearframe.apk -R "$GITHUB_REPOSITORY" --clobber
          gh release edit latest -R "$GITHUB_REPOSITORY" --notes "Built from ${GITHUB_SHA} on ${GITHUB_REF_NAME}"

  emulator:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: clearframe-apk
          path: out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android TV 8.0 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh ci/emulator-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: screenshots
      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        run: |
          [ -d screenshots ] || exit 0
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git fetch origin ci-screenshots || true
          git checkout --orphan ci-screenshots-new
          git rm -rq --cached . ; git clean -fdq -e screenshots
          git add screenshots
          git commit -qm "Emulator screenshots for ${GITHUB_SHA}"
          git push -f origin HEAD:ci-screenshots
